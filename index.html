<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Linux 1.0 — Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/01-base.css">
  <link rel="stylesheet" href="css/02-apps.css">
  <link rel="stylesheet" href="css/03-phone.css"></head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="boot-logo">Nova&nbsp;Linux</div>
  <div id="boot-lines"></div>
  <div id="boot-bar"><i></i></div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <div class="tb-left">
    <div id="tb-activities" title="Apps">Apps</div>
    <div id="tb-os">nova-linux 1.0</div>
  </div>
  <div class="tb-center" id="tb-clock">--</div>
  <div class="tb-right">
    <div class="tb-btn" id="tb-qs" title="Quick settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="17" height="10" rx="2.5"/><line x1="21.5" y1="10.5" x2="21.5" y2="13.5"/><rect x="4.5" y="9.5" width="10" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
      <span id="tb-batt">87%</span>
    </div>
  </div>
</div>

<!-- QUICK SETTINGS -->
<div id="qs-panel">
  <div class="qs-top">
    <div class="qs-batt">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="17" height="10" rx="2.5"/><line x1="21.5" y1="10.5" x2="21.5" y2="13.5"/><rect x="4.5" y="9.5" width="10" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
      <span id="qs-batt-pct">87%</span>
    </div>
    <button class="qs-powerbtn" id="qs-power" title="Power options">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    </button>
  </div>
  <div id="qs-power-sub">
    <button class="btn" id="qs-reboot">Restart</button>
    <button class="btn danger" id="qs-off">Power Off</button>
  </div>
  <div class="qs-slider">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <input type="range" id="qs-vol" min="0" max="100" value="65">
  </div>
  <div class="qs-slider">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input type="range" id="qs-bright" min="20" max="100" value="100">
  </div>
  <div class="qs-grid">
    <button class="qs-pill" id="qs-wifi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span class="qp-txt"><span class="qp-name">Wi-Fi</span><span class="qp-sub" id="qs-wifi-sub">Nova-Home</span></span>
      <span class="qp-arrow">></span>
    </button>
    <button class="qs-pill" id="qs-bt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg>
      <span class="qp-txt"><span class="qp-name">Bluetooth</span></span>
      <span class="qp-arrow">></span>
    </button>
    <button class="qs-pill" id="qs-pm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 15l3.5-3.5"/><path d="M20.5 12a8.5 8.5 0 1 0-17 0"/></svg>
      <span class="qp-txt"><span class="qp-name">Power Mode</span><span class="qp-sub" id="qs-pm-sub">Balanced</span></span>
      <span class="qp-arrow">></span>
    </button>
    <button class="qs-pill" id="qs-air">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      <span class="qp-txt"><span class="qp-name">Airplane Mode</span></span>
    </button>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="wp-aurora">
  <div id="desktop-icons"></div>
  <div id="dimmer"></div>
</div>

<!-- DOCK -->
<div id="dock"></div>

<!-- LAUNCHER -->
<div id="launcher"><div class="lg-grid"></div></div>

<!-- HALT -->
<div id="haltscreen">
  <div>System halted.</div>
  <button class="btn" onclick="location.reload()">Power on</button>
</div>
  <script src="js/01-core.js"></script>
  <script src="js/02-fs.js"></script>
  <script src="js/03-commands.js"></script>
  <script src="js/04-window-manager.js"></script>
  <script src="js/apps/05-terminal.js"></script>
  <script src="js/apps/06-files.js"></script>
  <script src="js/apps/07-help.js"></script>
  <script src="js/apps/08-nova-ai.js"></script>
  <script src="js/apps/09-calendar.js"></script>
  <script src="js/apps/10-clock.js"></script>
  <script src="js/apps/11-notes.js"></script>
  <script src="js/apps/12-settings.js"></script>
  <script src="js/13-shell.js"></script>
  <script src="js/14-boot.js"></script>
</body>
</html>
